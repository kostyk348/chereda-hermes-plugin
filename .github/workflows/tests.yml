name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        run: python3 --version
      - name: Node (статические тесты desktop/plugin.js)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Плагин объявляет только stdlib; fastapi даёт сам gateway Hermes,
      # поэтому в раннере его нужно поставить, а не ждать от приложения.
      - name: Зависимости раннера
        run: python3 -m pip install --quiet fastapi
      - name: Тесты плагина (включая гейт доказательств)
        run: python3 -m unittest discover -s tests -v
      - name: Валидация манифеста Hermes (если Hermes установлен)
        run: |
          if command -v hermes >/dev/null 2>&1; then
            hermes plugins validate .
          else
            echo "Hermes в раннере не установлен — шаг пропущен (валидация выполнена локально)"
          fi
